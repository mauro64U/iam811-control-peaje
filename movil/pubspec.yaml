name: iam811_peaje_movil
description: Aplicacion movil del Sistema Inteligente de Control de Peaje (IAM-811) con Google Sign-In, Modo Caseta (captura continua 2-5 fps) y Modo Consulta (Agente Conversacional).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_sign_in: ^6.2.2
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
